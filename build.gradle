plugins {
    id 'java-library'
}

group = 'com.madras'
version = '0.1.0'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java { srcDirs = ['java/src/main/java'] }
        resources { srcDirs = ['java/src/main/resources'] }
    }
}

java {
    // Java 8 bytecode floor: runs on any JVM 8+ (broad Spark cluster
    // compatibility) and is fully compatible with Android's D8/R8
    // desugaring, so the same source builds for both a desktop JAR and an
    // Android-consumable artifact without forking the code.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// --------------------------------------------------------------------
// Spark dependencies: resolved from a LOCAL jars/ directory, not Maven
// coordinates. This build was verified against a Spark distribution
// (3.5.9) that is not a standard Apache release -- its module split
// (spark-sql-api, kryo-shaded as separate jars) means the matching
// `org.apache.spark:spark-sql_2.12:3.5.9`-style Maven coordinate almost
// certainly doesn't exist on Maven Central. Pointing straight at your
// actual $SPARK_HOME/jars avoids ever needing that artifact to be
// published anywhere -- set SPARK_HOME as an environment variable or
// pass -PsparkHome=/path/to/spark when invoking gradle.
// --------------------------------------------------------------------
def sparkHome = project.hasProperty('sparkHome') ? project.property('sparkHome') : System.getenv('SPARK_HOME')
if (sparkHome == null) {
    throw new GradleException(
        "Set SPARK_HOME (env var) or pass -PsparkHome=/path/to/spark so Gradle can find your Spark jars/ directory.")
}

dependencies {
    // compileOnly: these are provided by the Spark runtime at execution
    // time, not bundled into our jar.
    compileOnly fileTree(dir: "${sparkHome}/jars", include: '*.jar')

    testImplementation fileTree(dir: "${sparkHome}/jars", include: '*.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

test {
    useJUnitPlatform()
}

// --------------------------------------------------------------------
// Native library packaging: copies whatever's under
// native/build-out/<os-arch>/libmadras_jni.* into the JAR's
// resources/natives/<os-arch>/ tree, matching MadrasNative.java's lookup
// path. Run the native CMake build for each target platform first (see
// README), placing outputs under native/build-out/<os-arch>/ before
// running `gradle jar`.
// --------------------------------------------------------------------
processResources {
    from('native/build-out') {
        into 'natives'
    }
}

// `gradle jar` (the standard java-library task) now does everything in one
// shot: compiles java/src/main/java, copies java/src/main/resources AND
// native/build-out/* (via processResources above) into the jar, and
// produces build/libs/madras-jvm-0.1.0.jar.

